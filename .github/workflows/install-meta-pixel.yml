name: Install Meta Pixel

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  install:
    if: github.head_ref == 'agent/meta-pixel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meta-pixel
      - name: Add Meta Pixel to all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              'index.html',
              'inventory.html',
              'buyback.html',
              'import-cars.html',
              'cx-automobile.html',
              'value.html',
              'prove.html',
              'CostV1.html',
              '404.html',
          ]

          pixel = '''    <!-- Meta Pixel Code -->
              <script>
              !function(f,b,e,v,n,t,s)
              {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
              n.callMethod.apply(n,arguments):n.queue.push(arguments)};
              if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
              n.queue=[];t=b.createElement(e);t.async=!0;
              t.src=v;s=b.getElementsByTagName(e)[0];
              s.parentNode.insertBefore(t,s)}(window, document,'script',
              'https://connect.facebook.net/en_US/fbevents.js');
              fbq('init', '1717841662825848');
              fbq('track', 'PageView');
              </script>
              <noscript><img height="1" width="1" style="display:none"
              src="https://www.facebook.com/tr?id=1717841662825848&ev=PageView&noscript=1"
              /></noscript>
              <!-- End Meta Pixel Code -->
          '''

          for filename in files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '1717841662825848' in text:
                  continue
              if '<head>' not in text:
                  raise RuntimeError(f'Missing <head> in {filename}')
              path.write_text(text.replace('<head>', '<head>\n' + pixel, 1), encoding='utf-8')

          for filename in files:
              text = Path(filename).read_text(encoding='utf-8')
              count = text.count("fbq('init', '1717841662825848')")
              if count != 1:
                  raise RuntimeError(f'{filename}: expected 1 Meta Pixel init, found {count}')

          Path('.github/workflows/install-meta-pixel.yml').unlink()
          PY
      - name: Commit installed Pixel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html inventory.html buyback.html import-cars.html cx-automobile.html value.html prove.html CostV1.html 404.html .github/workflows/install-meta-pixel.yml
          git commit -m "add Meta Pixel tracking"
          git push origin HEAD:agent/meta-pixel
