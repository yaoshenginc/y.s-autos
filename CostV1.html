<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>耀笙系統 | 內部專用</title>
    <style>
        :root {
            --bg-dark: #0a0a0a; --card-bg: #161616; --gold: #c5a059;
            --text-main: #ffffff; --text-dim: #a0a0a0; --border: #2c2c2c;
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        #mainContent { display: none; }
        .container {
            background: var(--card-bg); width: 100%; max-width: 480px;
            padding: 40px; border-radius: 24px; border: 1px solid var(--border);
            position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .container::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        h2 { text-align: center; font-size: 22px; letter-spacing: 4px; color: var(--gold); font-weight: 300; margin-bottom: 30px;}
        .label { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; display: block; }
        input {
            width: 100%; background: #222; border: 1px solid var(--border);
            padding: 14px; border-radius: 12px; color: white; font-size: 18px;
            margin-bottom: 20px; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--gold); outline: none; background: #2a2a2a; }
        .row { display: flex; gap: 15px; }
        .row div { flex: 1; }
        .result-panel {
            background: linear-gradient(145deg, #1e1e1e, #121212);
            padding: 25px; border-radius: 20px; border: 1px solid var(--border);
            margin-top: 10px; text-align: center;
        }
        .total-value { font-size: 34px; font-weight: 700; color: var(--gold); margin: 10px 0; }
        .item-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--text-dim); }
        .item-row span:last-child { color: white; font-family: monospace; }
        .footer-note { text-align: center; font-size: 11px; color: #444; margin-top: 25px; line-height: 1.6; }
        input::placeholder { color: #444; font-size: 14px; }
    </style>
</head>
<body>

<div id="mainContent" class="container">
    <h2>Y.S. AUTOS 內部核算</h2>
    
    <label class="label">美國網站買價 (USD)</label>
    <input type="number" id="pUsd" placeholder="請輸入金額" oninput="run()">

    <div class="row">
        <div>
            <label class="label">車輛年份 (西元)</label>
            <input type="number" id="pYear" placeholder="例如 2023" oninput="run()">
        </div>
        <div>
            <label class="label">里程 (Miles)</label>
            <input type="number" id="pMile" placeholder="輸入里程" oninput="run()">
        </div>
    </div>

    <div class="row">
        <div>
            <label class="label">美國段雜費 (USD)</label>
            <input type="number" id="pFee" value="3000" oninput="run()">
        </div>
        <div>
            <label class="label">當前匯率 <span id="syncStatus" style="font-size:10px; color:var(--gold)"></span></label>
            <input type="number" id="pEx" placeholder="自動獲取中..." step="0.01" oninput="run()">
        </div>
    </div>

    <div class="result-panel">
        <div style="font-size: 12px; color: var(--text-dim); letter-spacing: 1px;">預估進口總成本 (TWD)</div>
        <div class="total-value" id="vTotal">NT$ 0</div>
        <div style="height:1px; background:var(--border); margin: 15px 0;"></div>
        <div class="item-row"><span>車價折合台幣</span><span id="vCar">0</span></div>
        <div class="item-row"><span>預估關稅 (含海運)</span><span id="vTax">0</span></div>
        <div class="item-row"><span>美國段雜費</span><span id="vUs">0</span></div>
        <div class="item-row"><span>台灣段固定規費</span><span>85,000</span></div>
    </div>

    <div class="footer-note">
        PRECISION LOGIC V3.0 // 耀笙專屬校準<br>
        本工具僅供內部評估使用
    </div>
</div>

<script>
    const SECRET_KEY = "88"; // 修改你的密碼

    // 密碼保護
    window.onload = function() {
        const userInput = prompt("請輸入系統授權密碼：");
        if (userInput === SECRET_KEY) {
            document.getElementById("mainContent").style.display = "block";
            fetchExRate(); // 登入成功後抓匯率
        } else {
            alert("授權失敗");
            document.body.innerHTML = "<h2 style='color:var(--gold); text-align:center; margin-top:200px;'>ACCESS DENIED</h2>";
        }
    };

    // 嘗試抓取即時匯率
    async function fetchExRate() {
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            const rate = data.rates.TWD;
            if(rate) {
                document.getElementById('pEx').value = rate.toFixed(2);
                document.getElementById('syncStatus').innerText = "(已自動更新)";
            }
        } catch (e) {
            document.getElementById('pEx').placeholder = "請手動輸入匯率";
            document.getElementById('syncStatus').innerText = "(連線失敗)";
        }
    }

    function run() {
        const usd = parseFloat(document.getElementById('pUsd').value) || 0;
        const year = parseInt(document.getElementById('pYear').value) || 0;
        const mile = parseFloat(document.getElementById('pMile').value) || 0;
        const usFee = parseFloat(document.getElementById('pFee').value) || 0;
        const ex = parseFloat(document.getElementById('pEx').value) || 0;

        // 檢查必要欄位，未填寫則不計算
        if (usd === 0 || year === 0 || ex === 0) return;

        // --- 核心邏輯 ---
        const age = 2026 - year;
        let dep = 1.0;
        if (age <= 1) dep = 0.95; 
        else if (age === 2) dep = 0.88; 
        else if (age === 3) dep = 0.82; 
        else if (age === 4) dep = 0.76; 
        else if (age === 5) dep = 0.69; 
        else dep = 0.62;

        const mileAdjustment = Math.min((mile / 10000) * 0.005, 0.05);
        const finalDep = dep - mileAdjustment;

        const cif = usd * ex * finalDep;
        const tax = (cif * 0.542) + 46000; 
        
        const usFeeTwd = usFee * ex;
        const total = (usd * ex) + usFeeTwd + tax + 85000;

        document.getElementById('vTotal').innerText = 'NT$ ' + Math.round(total).toLocaleString();
        document.getElementById('vCar').innerText = Math.round(usd * ex).toLocaleString();
        document.getElementById('vTax').innerText = Math.round(tax).toLocaleString();
        document.getElementById('vUs').innerText = Math.round(usFeeTwd).toLocaleString();
    }
</script>

</body>
</html>
